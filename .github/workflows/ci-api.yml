# FR-15 parcial / AD-14 — build + testes + gate JaCoCo ≥ 90% (quarkus-jacoco).
# Deploy (ECR / CDK) fica fora deste workflow.
name: ci(api)

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'feedbacks/apps/api/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'feedbacks/apps/api/**'
      - '.github/workflows/ci-api.yml'

concurrency:
  group: ci-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: mvn verify (JaCoCo)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: feedbacks/apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: feedbacks/apps/api/pom.xml

      - name: Maven verify (unit + @QuarkusTest + JaCoCo gate)
        run: mvn -B verify
        env:
          # Dev Services PostgreSQL no profile %test (Testcontainers / Docker do runner)
          MAVEN_OPTS: -Xmx1g

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: feedbacks/apps/api/target/jacoco-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Parse JaCoCo coverage
        if: always()
        id: jacoco
        working-directory: ${{ github.workspace }}
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path("feedbacks/apps/api/target/jacoco-report/jacoco.xml")
          out_path = Path("coverage.md")
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          marker = "<!-- jacoco-coverage-api -->"

          if not xml_path.is_file():
              body = "\n".join(
                  [
                      marker,
                      "## JaCoCo coverage (api)",
                      "",
                      f"_Report not found at `{xml_path}` (build may have failed before JaCoCo report)._ ",
                      "",
                      f"[Workflow run]({run_url})",
                      "",
                  ]
              )
              out_path.write_text(body, encoding="utf-8")
              print(body)
              raise SystemExit(0)

          root = ET.parse(xml_path).getroot()
          counters = {}
          for counter in root.findall("counter"):
              counters[counter.get("type")] = (
                  int(counter.get("covered", "0")),
                  int(counter.get("missed", "0")),
              )

          def pct(covered: int, missed: int) -> str:
              total = covered + missed
              if total == 0:
                  return "n/a"
              return f"{(covered / total) * 100:.1f}%"

          rows = []
          for name in ("LINE", "BRANCH", "INSTRUCTION"):
              covered, missed = counters.get(name, (0, 0))
              rows.append(
                  f"| {name} | {covered} | {missed} | {pct(covered, missed)} |"
              )

          body = "\n".join(
              [
                  marker,
                  "## JaCoCo coverage (api)",
                  "",
                  "| Counter | Covered | Missed | Coverage |",
                  "| --- | ---: | ---: | ---: |",
                  *rows,
                  "",
                  "Gate: ≥ 90% LINE (AD-14)",
                  "",
                  f"[Workflow run]({run_url})",
                  "",
              ]
          )
          out_path.write_text(body, encoding="utf-8")
          print(body)
          PY

      - name: Publish JaCoCo to job summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment JaCoCo coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- jacoco-coverage-api -->';
            const body = fs.readFileSync('coverage.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
