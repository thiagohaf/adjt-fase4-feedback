# Sobe / retoma TODOS os recursos da demo.
# - Se pausados (RDS stopped, ApiStack ausente, crons DISABLED): liga de novo.
# - Se destroy apagou RDS/secrets: recria RDS público + secrets + 3 stacks.
# - Se já existirem: atualiza via CDK deploy (desiredCount=1, crons ENABLED).
#
# Disparo: Actions → deploy(all) → Run workflow
#
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ACCOUNT_ID
# Opcional: FEEDBACKS_SQS_ALERT_QUEUE_URL, FEEDBACKS_ADMIN_EMAIL
#           (adminEmail cai no 1º e-mail verificado no SES se omitido)
name: deploy(all)

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: Aplicar seed-report-demo.sql no RDS (após health/Flyway)
        type: boolean
        default: true
      enable_crons:
        description: Habilitar EventBridge feedbacks-report-*
        type: boolean
        default: true

concurrency:
  group: demo-lifecycle
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  RDS_INSTANCE: feedbacks-demo
  API_STACK: FeedbacksApiStack
  DB_SECRET_NAME: feedbacks/db

jobs:
  deploy:
    name: RDS + secrets + 3 stacks + crons + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            feedbacks/apps/api/pom.xml
            feedbacks/apps/notification/pom.xml
            feedbacks/apps/report/pom.xml
            feedbacks/infra/pom.xml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install AWS CDK
        run: npm install -g aws-cdk@2

      - name: chmod lifecycle scripts
        run: chmod +x feedbacks/infra/scripts/*.sh

      - name: Repair broken CDKToolkit + orphan assets
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: feedbacks/infra/scripts/repair-cdk-bootstrap.sh

      - name: CDK bootstrap
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          cdk bootstrap "aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}"

      - name: Provision/start RDS (recria se destroy apagou)
        run: feedbacks/infra/scripts/demo-lifecycle.sh ensure-rds-available

      - name: Ensure Secrets Manager (db / jwt / adminEmail)
        env:
          FEEDBACKS_ADMIN_EMAIL: ${{ secrets.FEEDBACKS_ADMIN_EMAIL }}
        run: feedbacks/infra/scripts/demo-lifecycle.sh ensure-secrets

      - name: Reparar ApiStack/ECR órfãos (evita conflito no deploy)
        run: feedbacks/infra/scripts/demo-lifecycle.sh repair-api-stack

      - name: Package Lambda zips (synth precisa dos assets)
        run: |
          mvn -B -q -f feedbacks/apps/notification/pom.xml package
          mvn -B -q -f feedbacks/apps/report/pom.xml package
          test -f feedbacks/apps/notification/target/function.zip
          test -f feedbacks/apps/report/target/function.zip

      - name: CDK deploy (Alerta + Relatório + API)
        working-directory: feedbacks/infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          FEEDBACKS_DB_SECRET_NAME: feedbacks/db
          FEEDBACKS_JWT_SECRET_NAME: feedbacks/jwt
          FEEDBACKS_SQS_ALERT_QUEUE_URL: ${{ secrets.FEEDBACKS_SQS_ALERT_QUEUE_URL }}
          FEEDBACKS_ACM_CERT_ARN: ${{ secrets.FEEDBACKS_ACM_CERT_ARN }}
        run: |
          mvn -B -q compile
          cdk deploy FeedbacksAlertaNotificationStack FeedbacksRelatorioStack FeedbacksApiStack \
            --require-approval never

      - name: Enable EventBridge report crons
        if: ${{ inputs.enable_crons }}
        run: feedbacks/infra/scripts/demo-lifecycle.sh enable-crons

      - name: Smoke health via ALB (Flyway sobe o schema)
        id: smoke
        run: feedbacks/infra/scripts/demo-lifecycle.sh smoke-health

      - name: Seed report demo SQL
        if: ${{ inputs.run_seed }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          SECRET=$(aws secretsmanager get-secret-value --secret-id "$DB_SECRET_NAME" \
            --query SecretString --output text)
          eval "$(SECRET="$SECRET" python3 - <<'PY'
          import json, os, shlex
          s = json.loads(os.environ["SECRET"])
          url = s["dbUrl"]
          if not url.startswith("jdbc:postgresql://"):
              raise SystemExit(f"dbUrl inesperado: {url}")
          rest = url[len("jdbc:postgresql://"):]
          hostport, db = rest.rsplit("/", 1)
          host, port = hostport.split(":")
          print(f"export PGHOST={shlex.quote(host)}")
          print(f"export PGPORT={shlex.quote(port)}")
          print(f"export PGDATABASE={shlex.quote(db)}")
          print(f"export PGUSER={shlex.quote(s['dbUser'])}")
          print(f"export PGPASSWORD={shlex.quote(s['dbPassword'])}")
          PY
          )"
          unset SECRET
          export PGSSLMODE=require
          psql -v ON_ERROR_STOP=1 -f feedbacks/infra/scripts/seed-report-demo.sql
          echo "Seed aplicado."

      - name: Harden RDS SG (ECS + Report Lambda; remove 0.0.0.0/0)
        run: feedbacks/infra/scripts/demo-lifecycle.sh harden-rds-sg

      - name: Job summary
        if: always()
        run: |
          {
            echo "## deploy(all)"
            echo ""
            echo "| Item | Valor |"
            echo "|------|-------|"
            echo "| ApiAlbDns | \`${{ steps.smoke.outputs.alb_dns }}\` |"
            echo "| ApiHealthUrl | \`${{ steps.smoke.outputs.health_url }}\` |"
            echo "| Seed | \`${{ inputs.run_seed }}\` |"
            echo "| Crons | \`${{ inputs.enable_crons }}\` |"
            echo ""
            echo "### Postman"
            echo "1. Importe \`docs/postman/feedbacks-api.postman_collection.json\`"
            echo "2. Env **AWS ALB** — \`baseUrl\` = \`http://${{ steps.smoke.outputs.alb_dns }}\`"
            echo "3. Health → \`GET /api/v1/health\` · Avaliação → \`POST /avaliacao\`"
            echo "4. Confirme a subscription SNS do alarme (\`ApiAlarmTopicArn\`) no e-mail admin"
          } >> "$GITHUB_STEP_SUMMARY"
