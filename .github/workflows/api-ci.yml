name: API CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'feedbacks/apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'feedbacks/apps/api/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and JaCoCo (≥ 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: feedbacks/apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify (tests + JaCoCo gate)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publish JaCoCo summary
        if: always()
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/site/jacoco/jacoco.xml")
          if not report.exists():
              print("JaCoCo report not found")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          for counter in root.findall("counter"):
              if counter.get("type") != "LINE":
                  continue
              missed = int(counter.get("missed", 0))
              covered = int(counter.get("covered", 0))
              total = missed + covered
              ratio = (covered / total * 100) if total else 0
              print(f"Line coverage: {ratio:.1f}% ({covered}/{total})")
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a") as summary:
                      summary.write("## JaCoCo line coverage\n\n")
                      summary.write(f"**{ratio:.1f}%** ({covered}/{total} lines)\n")
              break
          PY

      - name: Upload JaCoCo report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: feedbacks/apps/api/target/site/jacoco/
          retention-days: 7

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: feedbacks/apps/api/target/surefire-reports/
          retention-days: 7
