# FR-15 — build imagem API + deploy FeedbacksApiStack (CDK asset / ECR).
# CI de testes permanece em ci-api.yml (JaCoCo).
# Requer secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ACCOUNT_ID
# (opcional FEEDBACKS_SQS_ALERT_QUEUE_URL; default da conta demo).
name: deploy(api)

on:
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: feedbacks-api

jobs:
  deploy:
    name: docker + cdk deploy ApiStack
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            feedbacks/apps/api/pom.xml
            feedbacks/infra/pom.xml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY"

      - name: Build and push image (evidência FR-15)
        working-directory: feedbacks/apps/api
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "Pushed $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: CDK deploy FeedbacksApiStack
        working-directory: feedbacks/infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          FEEDBACKS_DB_SECRET_NAME: feedbacks/db
          FEEDBACKS_JWT_SECRET_NAME: feedbacks/jwt
          FEEDBACKS_SQS_ALERT_QUEUE_URL: ${{ secrets.FEEDBACKS_SQS_ALERT_QUEUE_URL }}
        run: |
          npm install -g aws-cdk@2
          mvn -B -q compile
          cdk deploy FeedbacksApiStack --require-approval never
