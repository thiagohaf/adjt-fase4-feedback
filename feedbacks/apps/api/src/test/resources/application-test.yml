spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:feedbacks;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-min-256-bits-for-hs256-demo-key
    expiration: 1h

logging:
  level:
    root: WARN
