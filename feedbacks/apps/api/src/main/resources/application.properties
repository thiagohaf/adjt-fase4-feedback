# --- Shared JWT validation (AD-8 / design §7.1) ---
quarkus.http.auth.proactive=false
# Divergência (D3): mp.jwt.verify.publickey.algorithm=HS256 faz o SmallRye tratar
# a config como "public key" e IGNORAR smallrye.jwt.verify.secretkey (SRJWT03007).
# Usar smallrye.jwt.verify.algorithm=HS256 — registrado em divergencias.md da change.
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.path.groups=role
# Quarkus injeta defaults de demo (RSA publickey + issuer https://quarkus.io/issuer).
# Forçar NONE para usar apenas o secret HS256 derivado de app.jwt.secret (design §7.1/§9.2).
mp.jwt.verify.publickey=NONE
mp.jwt.verify.issuer=NONE
# smallrye.jwt.verify.secretkey derivado de app.jwt.secret via JwtJwkConfigSourceFactory

app.jwt.expiration=24h

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Health: contrato /api/v1/health via HealthResource; SmallRye em /q/health
quarkus.smallrye-health.root-path=/q/health

# Logging com traceId
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p traceId=%X{traceId} [%c{2.}] (%t) %s%e%n

# --- %local (default de desenvolvimento) ---
%local.app.jwt.secret=${JWT_SECRET:dev-only-secret-min-256-bits-for-hs256-demo}
%local.quarkus.datasource.db-kind=postgresql
%local.quarkus.datasource.username=feedbacks
%local.quarkus.datasource.password=feedbacks
%local.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/feedbacks
%local.quarkus.profile=local

# --- %aws — secret obrigatório (Secrets Manager / JWT_SECRET), sem default ---
%aws.app.jwt.secret=${JWT_SECRET}
%aws.quarkus.datasource.db-kind=postgresql
%aws.quarkus.datasource.username=${DB_USERNAME}
%aws.quarkus.datasource.password=${DB_PASSWORD}
%aws.quarkus.datasource.jdbc.url=${DB_URL}
# Fila de alerta ALTA (FR-10). Vazio = no-op seguro (CI sem SQS).
%aws.feedbacks.messaging.sqs.queue-url=${FEEDBACKS_SQS_ALERT_QUEUE_URL:}

# --- %test — Dev Services PostgreSQL + secret fixo ---
%test.app.jwt.secret=test-secret-min-256-bits-for-hs256-demo-key
%test.app.jwt.expiration=1h
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.log.category."com.fiap.feedbacks".level=INFO
%test.quarkus.log.category."io.quarkus".level=WARN
%test.quarkus.log.category."org.hibernate".level=WARN
%test.quarkus.log.category."org.flywaydb".level=WARN

# Default profile for quarkus:dev / local runs
quarkus.profile=local

# JaCoCo (quarkus-jacoco) — relatório unificado no surefire
%test.quarkus.jacoco.report=true
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.excludes=**/JwtJwkConfigSourceFactory
