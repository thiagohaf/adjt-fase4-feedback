# Lambda Quarkus — packaging function.zip (AD-13)
# Handler AWS: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
quarkus.lambda.handler=report

# Destinatário do relatório (SPEC-12.4 / AD-12)
feedbacks.admin.email=${ADMIN_EMAIL:}
feedbacks.ses.from-email=${SES_FROM_EMAIL:${ADMIN_EMAIL:}}

# S3 relatórios (SPEC-12.2)
feedbacks.report.s3.bucket=${REPORT_S3_BUCKET:}

# Datasource read-only (AD-3 / AD-16) — via env / Secrets.
# Demo sem RDS: FEEDBACKS_REPORT_JDBC_ENABLED=false → EmptyAvaliacaoReadModel (zeros).
feedbacks.report.jdbc.enabled=${FEEDBACKS_REPORT_JDBC_ENABLED:false}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.enabled=${FEEDBACKS_REPORT_JDBC_ENABLED:false}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/feedbacks}
quarkus.datasource.username=${DB_USER:feedbacks}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.max-size=3

# Dev/test sem DB real — Agroal só sobe se JDBC for usado; fakes cobrem unitários
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.jacoco.report=true
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
